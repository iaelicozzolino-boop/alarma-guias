<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alarma Guías</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Sistema de diseño Marina Ibiza (hub v2): Manrope, modo claro, azul marino #1F3A68 */
  :root {
    color-scheme: light;
    --navy: #1F3A68;
    --text: #14181F;
    --text-dim: #6B7480;
    --line: #E1E5EA;
    --soft: #F4F6F8;
    --pressed: #E3E8EF;
    --focus-ring: #E1E9F4;
    --scrim: rgba(20, 24, 31, .4);
    --danger-bg: #FBECEC;
    --danger-fg: #A3282B;
    /* Colores funcionales náuticos: babor rojo, estribor verde */
    --babor: #C4302B;
    --estribor: #1E8A4C;
    --amber: #B7791F;
    --off-border: #B8C2CF;
    --off-fill: #FFFFFF;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #FFFFFF; color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font-family: var(--font); }

  /* Cabecera: logo centrado + etiqueta */
  header {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px 14px;
    background: #FFFFFF;
  }
  .header-logo { width: min(150px, 44vw); height: auto; display: block; }
  header h1 {
    margin: 0; font-size: 12px; font-weight: 600; line-height: 1.4;
    letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim);
  }

  /* Barra de fecha y botones: fija arriba al bajar por la lista */
  .date-bar {
    position: sticky; top: 0; z-index: 10;
    padding: 10px 16px 10px;
    background: #FFFFFF;
    border-bottom: 1px solid var(--line);
  }
  .date-bar > div { max-width: 640px; margin-left: auto; margin-right: auto; }
  .date-bar label {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-dim); white-space: nowrap;
  }
  .controlbar { display: flex; gap: 8px; align-items: center; }
  .controlbar-row2, .controlbar-row3 { display: flex; gap: 8px; margin-top: 8px; }

  #dateInput {
    flex: 1; min-width: 0; height: 44px;
    padding: 0 12px;
    border-radius: 12px; border: 1px solid var(--line);
    background: #FFFFFF; color: var(--text);
    font: 500 16px var(--font); outline: none;
  }
  #dateInput:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--focus-ring); }

  /* Botones: 44px, radio 12, 14/700 */
  #saveBtn, #mapBtn, #addNotifBtn, #notifBtn, .modal-btn {
    height: 44px; padding: 0 16px; border-radius: 12px; border: 0;
    font: 700 14px var(--font); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, color .15s;
  }
  #saveBtn { background: var(--navy); color: #FFFFFF; }
  #saveBtn.dirty { background: var(--navy); color: #FFFFFF; box-shadow: 0 0 0 3px var(--focus-ring); }
  #mapBtn { flex: 1; background: var(--soft); color: var(--text); }
  #mapBtn.active { background: var(--navy); color: #FFFFFF; }
  #addNotifBtn, #notifBtn { flex: 1; background: var(--soft); color: var(--text); }
  #saveBtn:active, #mapBtn:active, #addNotifBtn:active, #notifBtn:active, .modal-btn:active { opacity: .6; }
  @media (hover: hover) {
    #mapBtn:not(.active):hover, #addNotifBtn:hover, #notifBtn:not(.pulsing):hover, .modal-btn-close:hover { background: var(--pressed); }
  }
  #notifBtn.pulsing { animation: notifPulse 1.2s ease-in-out infinite; }
  @keyframes notifPulse {
    0%, 100% { background: var(--soft); color: var(--text); }
    50% { background: var(--danger-bg); color: var(--danger-fg); }
  }

  .status {
    margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--text-dim);
    display: flex; align-items: center; gap: 6px; min-height: 16px;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off-border); flex-shrink: 0; }
  .status.connected .dot { background: var(--estribor); }
  .status.error .dot { background: var(--babor); }
  .status.error { color: var(--danger-fg); }
  .status.dirty .dot { background: var(--amber); }

  .last-saved {
    max-width: 640px; margin: 0 auto; padding: 10px 16px 0;
    font-size: 12px; font-weight: 600; color: var(--text-dim);
  }
  .last-saved:empty { display: none; }

  .legend {
    max-width: 640px; margin: 0 auto;
    display: flex; gap: 16px; padding: 12px 16px 2px; flex-wrap: wrap;
    font-size: 12px; font-weight: 600; color: var(--text-dim);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--off-border); background: var(--off-fill); }
  .legend .swatch.g { background: var(--estribor); border-color: var(--estribor); }
  .legend .swatch.r { background: var(--babor); border-color: var(--babor); }

  /* Lista por muelles: cabecera tipo sección (punto + nombre + contador) y tarjeta con borde fino */
  main { padding: 6px 16px 40px; max-width: 640px; margin: 0 auto; }
  .pier { margin-top: 24px; }
  .pier-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text);
  }
  .pier-head::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--navy); flex: none; }
  .pier-head > span:first-child { flex: 1; display: flex; align-items: center; gap: 10px; }
  .pier-head > span:first-child::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .pier-head .count { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: none; color: var(--text-dim); }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #FFFFFF;
    border: 1px solid var(--line); border-top: 0;
  }
  .pier-head + .row { border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; }
  .pier .row:last-child { border-radius: 0 0 16px 16px; }
  .pier-head + .row:last-child { border-radius: 16px; }
  .row .num { font-size: 18px; font-weight: 700; width: 52px; flex-shrink: 0; color: var(--text); font-variant-numeric: tabular-nums; }
  .row .dots { display: flex; gap: 18px; flex: 1; justify-content: flex-end; }

  .dotbtn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 56px; background: none; border: none; padding: 4px; border-radius: 12px;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .dotbtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
  .dotbtn .circle {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--off-border); background: var(--off-fill);
    transition: background .12s, border-color .12s, transform .08s;
  }
  .dotbtn:active .circle { transform: scale(.9); }
  .dotbtn .label { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--text-dim); }
  .dotbtn.on-estribor .circle { background: var(--estribor); border-color: var(--estribor); }
  .dotbtn.on-babor .circle { background: var(--babor); border-color: var(--babor); }
  .dotbtn.on-estribor .label, .dotbtn.on-babor .label { color: var(--text); }

  .row.flash { animation: flashRow 1.3s ease; }
  @keyframes flashRow {
    0% { background: #D6E1EF; }
    100% { background: #FFFFFF; }
  }

  /* Mapa */
  #mapView { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
  .map-hint { font-size: 13px; line-height: 1.5; color: var(--text-dim); padding: 0 0 8px; font-weight: 500; }
  .map-pier { margin-top: 20px; }
  .map-pier-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text);
  }
  .map-pier-head::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--navy); flex: none; }
  .map-pier-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
  .map-tile {
    padding: 6px 2px 8px; background: #FFFFFF;
    border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    transition: background .15s;
  }
  @media (hover: hover) { .map-tile:hover { background: var(--soft); } }
  .map-tile:active { opacity: .6; }
  .map-tile .map-num { font-size: 11px; font-weight: 700; color: var(--text); margin-bottom: 5px; white-space: nowrap; }
  .map-tile .map-dots { display: flex; gap: 4px; margin-bottom: 4px; }
  .map-tile .map-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--off-border); background: var(--off-fill); }
  .map-tile .map-dot.on-babor { background: var(--babor); border-color: var(--babor); }
  .map-tile .map-dot.on-estribor { background: var(--estribor); border-color: var(--estribor); }
  .map-tile .map-boat { width: 28px; height: auto; display: block; pointer-events: none; }
  .map-tile .map-boat .hull { fill: #FFFFFF; stroke: var(--navy); stroke-width: 2.2; }
  .map-tile .map-boat .cabin { fill: var(--line); }

  /* Ventanas: hoja inferior en móvil, modal centrado en ordenador */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200; background: var(--scrim);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade .15s;
  }
  .modal-box {
    width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
    background: #FFFFFF; color: var(--text);
    border-radius: 24px 24px 0 0;
    padding: 12px 22px calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-direction: column; gap: 10px;
    animation: up .2s ease-out;
  }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; flex: none; margin-bottom: 4px; }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; padding: 16px; }
    .modal-box { border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(20, 24, 31, .2); }
    .grab { display: none; }
  }
  .modal-box h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; color: var(--text); }
  .modal-box label {
    display: block; margin: 6px 0 -2px; font-size: 12px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim);
  }
  .modal-box input[type="date"], .modal-box textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 12px;
    background: #FFFFFF; color: var(--text); font: 500 16px var(--font); outline: none;
  }
  .modal-box input[type="date"] { height: 48px; padding: 0 14px; }
  .modal-box textarea { min-height: 140px; padding: 12px 14px; line-height: 1.45; resize: vertical; }
  .modal-box input[type="date"]:focus, .modal-box textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--focus-ring); }
  .modal-btn { display: flex; width: 100%; margin-top: 2px; background: var(--navy); color: #FFFFFF; }
  .modal-btn:disabled { opacity: .45; cursor: default; }
  .modal-btn-close { background: var(--soft); color: var(--text); }
  .modal-error { min-height: 16px; font-size: 13px; font-weight: 600; color: var(--danger-fg); }
  .modal-error:empty { min-height: 0; }
  #notifList p { margin: 0 0 6px; font-size: 13px; line-height: 1.5; color: var(--text-dim); }
  .notif-item {
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 8px;
    color: var(--text); font-size: 15px; font-weight: 500; line-height: 1.45;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  @keyframes up { from { transform: translateY(20px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  .hidden { display: none !important; }

  /* Acceso (si se vuelve a activar) */
  #loginOverlay {
    position: fixed; inset: 0; z-index: 100; background: #FFFFFF;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #loginOverlay.hidden { display: none; }
  .login-box { width: 100%; max-width: 360px; border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .login-box h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  .login-box p { margin: 0 0 16px; color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  .login-box input {
    width: 100%; height: 48px; padding: 0 14px; font: 500 16px var(--font); border-radius: 12px;
    border: 1px solid var(--line); background: #FFFFFF; color: var(--text); outline: none;
  }
  .login-box input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--focus-ring); }
  .login-box button {
    width: 100%; height: 44px; margin-top: 12px; font: 700 14px var(--font);
    border: 0; border-radius: 12px; background: var(--navy); color: #FFFFFF; cursor: pointer;
  }
  .login-box button:disabled { opacity: .45; }
  #loginError { margin-top: 10px; min-height: 18px; font-size: 13px; color: var(--danger-fg); }
</style>
</head>

  <h1>Alarma guías</h1>
</header>

<div class="date-bar">
  <div class="controlbar">
    <label for="dateInput">Fecha</label>
    <input type="date" id="dateInput">
    <button type="button" id="saveBtn">Guardar</button>
  </div>
  <div class="controlbar-row2">
    <button type="button" id="mapBtn">Mapa</button>
  </div>
  <div class="controlbar-row3">
    <button type="button" id="addNotifBtn">Nueva notificación</button>
    <button type="button" id="notifBtn">Notificaciones</button>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Conectando…</span></div>
</div>

<div class="last-saved" id="lastSaved"></div>

<div class="legend">
  <span><span class="swatch g"></span> Estribor (E)</span>
  <span><span class="swatch r"></span> Babor (B)</span>
  <span><span class="swatch"></span> Sin guía</span>
</div>

<main id="main"></main>

<div id="mapView" class="hidden">
  <div class="map-hint">Vista de conjunto. Toca un amarre para ir a la lista y cambiar su alarma.</div>
</div>


<!-- Ventanas de notificaciones: tienen que estar ANTES del <script> que las usa -->
<div id="addNotifModal" class="modal-overlay hidden">
  <div class="modal-box" role="dialog" aria-labelledby="addNotifTitle">
    <div class="grab"></div>
    <h2 id="addNotifTitle">Nueva notificación</h2>
    <label for="notifDate">Fecha</label>
    <input type="date" id="notifDate">
    <label for="notifText">Texto</label>
    <textarea id="notifText"></textarea>
    <div class="modal-error" id="notifError"></div>
    <button type="button" class="modal-btn" id="saveNotifBtn">Guardar notificación</button>
    <button type="button" class="modal-btn modal-btn-close" id="addNotifClose">Cerrar</button>
  </div>
</div>

<div id="notifModal" class="modal-overlay hidden">
  <div class="modal-box" role="dialog" aria-labelledby="notifTitle">
    <div class="grab"></div>
    <h2 id="notifTitle">Notificaciones de hoy</h2>
    <div id="notifList"></div>
    <button type="button" class="modal-btn modal-btn-close" id="notifClose">Cerrar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
<script>
(function () {
  const PIERS = [
    { id: 'A', name: 'Muelle A', range: [20, 32] },
    { id: 'D', name: 'Muelle D', range: [1, 16] },
    { id: 'E', name: 'Muelle E', range: [1, 17] }
  ];
  const AUTOSAVE_DELAY_MS = 2500;
  const TEAM_EMAIL = 'equipo@alarma-guias.app';
  const firebaseConfig = {
    apiKey: "AIzaSyBB_aFIr3DFN2-K1_fBgzF8pbHhvF2Onwg",
    authDomain: "alarma-de-guias.firebaseapp.com",
    projectId: "alarma-de-guias",
    storageBucket: "alarma-de-guias.firebasestorage.app",
    messagingSenderId: "908955258814",
    appId: "1:908955258814:web:5026fa7c88d93544fb73ef"
  };

  function berthLabel(n) { return n < 10 ? '0' + n : '' + n; }
  function berthId(pierId, n) { return pierId + berthLabel(n); }
  function todayISO() {
    const d = new Date();
    const m = ('' + (d.getMonth() + 1)).padStart(2, '0');
    const day = ('' + d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  let currentView = 'list';
  let state = {};
  let pending = {};
  let dirty = false;
  let db = null;
  let unsub = null;
  let currentDate = todayISO();
  let saving = false;
  let autosaveTimer = null;

  const mainEl = document.getElementById('main');
  const mapViewEl = document.getElementById('mapView');
  const statusEl = document.getElementById('status');
  const statusTextEl = document.getElementById('statusText');
  const dateInput = document.getElementById('dateInput');
  const saveBtn = document.getElementById('saveBtn');
  const mapBtn = document.getElementById('mapBtn');
  const lastSavedEl = document.getElementById('lastSaved');
  const addNotifBtn = document.getElementById('addNotifBtn');
  const notifBtn = document.getElementById('notifBtn');
  const addNotifModal = document.getElementById('addNotifModal');
  const notifModal = document.getElementById('notifModal');
  const notifDate = document.getElementById('notifDate');
  const notifText = document.getElementById('notifText');
  const notifError = document.getElementById('notifError');
  const saveNotifBtn = document.getElementById('saveNotifBtn');
  const addNotifClose = document.getElementById('addNotifClose');
  const notifClose = document.getElementById('notifClose');
  const notifList = document.getElementById('notifList');

  dateInput.value = currentDate;

  function setStatus(kind, text) {
    statusEl.className = 'status ' + kind;
    statusTextEl.textContent = text;
  }

  function setDirty(v) {
    dirty = v;
    saveBtn.classList.toggle('dirty', v);
    if (v) setStatus('dirty', 'Cambios sin guardar (autoguardando…)');
  }

  function buildStaticLayout() {
    mainEl.innerHTML = '';
    PIERS.forEach(pier => {
      const section = document.createElement('div');
      section.className = 'pier';
      const head = document.createElement('div');
      head.className = 'pier-head';
      const total = pier.range[1] - pier.range[0] + 1;
      head.innerHTML = '<span>' + pier.name + '</span><span class="count">' + total + ' amarres</span>';
      section.appendChild(head);

      for (let n = pier.range[0]; n <= pier.range[1]; n++) {
        const id = berthId(pier.id, n);
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = id;

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = pier.id + berthLabel(n);
        row.appendChild(num);

        const dots = document.createElement('div');
        dots.className = 'dots';

        const babor = document.createElement('button');
        babor.className = 'dotbtn';
        babor.dataset.id = id;
        babor.dataset.side = 'babor';
        babor.innerHTML = '<span class="circle"></span><span class="label">BABOR</span>';

        const estribor = document.createElement('button');
        estribor.className = 'dotbtn';
        estribor.dataset.id = id;
        estribor.dataset.side = 'estribor';
        estribor.innerHTML = '<span class="circle"></span><span class="label">ESTRIB.</span>';

        dots.appendChild(babor);
        dots.appendChild(estribor);
        row.appendChild(dots);
        section.appendChild(row);
      }
      mainEl.appendChild(section);
    });
    mainEl.addEventListener('click', onDotClick);
  }

  function buildMapLayout() {
    mapViewEl.querySelectorAll('.map-pier').forEach(el => el.remove());
    PIERS.forEach(pier => {
      const section = document.createElement('div');
      section.className = 'map-pier';

      const head = document.createElement('div');
      head.className = 'map-pier-head';
      head.textContent = pier.name;
      section.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'map-grid';

      for (let n = pier.range[0]; n <= pier.range[1]; n++) {
        const id = berthId(pier.id, n);
        const tile = document.createElement('div');
        tile.className = 'map-tile';
        tile.dataset.id = id;

        const num = document.createElement('div');
        num.className = 'map-num';
        num.textContent = berthLabel(n) + ' ' + pier.id;
        tile.appendChild(num);

        const dots = document.createElement('div');
        dots.className = 'map-dots';
        const babor = document.createElement('span');
        babor.className = 'map-dot';
        babor.dataset.side = 'babor';
        const estribor = document.createElement('span');
        estribor.className = 'map-dot';
        estribor.dataset.side = 'estribor';
        dots.appendChild(babor);
        dots.appendChild(estribor);
        tile.appendChild(dots);

        tile.insertAdjacentHTML('beforeend',
          '<svg class="map-boat" viewBox="0 0 40 60">' +
            '<path class="hull" d="M20,2 C29,8 34,18 34,28 L34,46 C34,54 28,58 20,58 ' +
              'C12,58 6,54 6,46 L6,28 C6,18 11,8 20,2 Z"/>' +
            '<rect class="cabin" x="14" y="19" width="12" height="23" rx="4"/>' +
          '</svg>'
        );

        tile.addEventListener('click', () => goToRow(id));

        grid.appendChild(tile);
      }
      section.appendChild(grid);
      mapViewEl.appendChild(section);
    });
  }

  function goToRow(id) {
    showView('list');
    const row = mainEl.querySelector('.row[data-id="' + id + '"]');
    if (!row) return;
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1400);
  }

  function showView(view) {
    currentView = view;
    mainEl.classList.toggle('hidden', view !== 'list');
    mapViewEl.classList.toggle('hidden', view !== 'map');
    mapBtn.classList.toggle('active', view === 'map');
    mapBtn.textContent = view === 'map' ? 'Lista' : 'Mapa';
    document.body.classList.toggle('map-mode', view === 'map');
    window.scrollTo(0, 0);
  }

  function renderRow(id) {
    const s = state[id] || { babor: false, estribor: false };
    const row = mainEl.querySelector('.row[data-id="' + id + '"]');
    if (row) {
      row.querySelector('.dotbtn[data-side="babor"]').classList.toggle('on-babor', !!s.babor);
      row.querySelector('.dotbtn[data-side="estribor"]').classList.toggle('on-estribor', !!s.estribor);
    }
    const tile = mapViewEl.querySelector('.map-tile[data-id="' + id + '"]');
    if (tile) {
      tile.querySelector('.map-dot[data-side="babor"]').classList.toggle('on-babor', !!s.babor);
      tile.querySelector('.map-dot[data-side="estribor"]').classList.toggle('on-estribor', !!s.estribor);
    }
  }

  function renderAll() {
    PIERS.forEach(pier => {
      for (let n = pier.range[0]; n <= pier.range[1]; n++) renderRow(berthId(pier.id, n));
    });
  }

  function onDotClick(e) {
    const btn = e.target.closest('.dotbtn');
    if (!btn) return;
    const id = btn.dataset.id;
    const side = btn.dataset.side;
    const current = state[id] || { babor: false, estribor: false };
    const next = { babor: !!current.babor, estribor: !!current.estribor };
    next[side] = !next[side];
    state[id] = next;
    pending[id] = next;
    renderRow(id);
    setDirty(true);
    scheduleAutosave();
  }

  function blankState() {
    const s = {};
    PIERS.forEach(pier => {
      for (let n = pier.range[0]; n <= pier.range[1]; n++) s[berthId(pier.id, n)] = { babor: false, estribor: false };
    });
    return s;
  }

  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => { save('auto'); }, AUTOSAVE_DELAY_MS);
  }

  function loadDate(date) {
    if (unsub) { unsub(); unsub = null; }
    clearTimeout(autosaveTimer);
    currentDate = date;
    state = blankState();
    pending = {};
    setDirty(false);
    lastSavedEl.textContent = '';
    renderAll();

    if (!db) return;

    setStatus('', 'Cargando ' + date + '…');
    unsub = db.collection('days').doc(date).onSnapshot(
      (snap) => {
        const data = (snap.exists ? snap.data() : {}) || {};
        state = blankState();
        Object.keys(data).forEach(id => {
          if (id === '_meta' || !state[id]) return;
          if (pending[id]) { state[id] = pending[id]; return; }
          state[id] = { babor: !!data[id].babor, estribor: !!data[id].estribor };
        });
        if (data._meta && data._meta.updatedAt) {
          const t = new Date(data._meta.updatedAt);
          lastSavedEl.textContent = 'Guardado por última vez: ' + t.toLocaleString('es-ES');
        } else if (!snap.exists) {
          lastSavedEl.textContent = 'Sin datos guardados para este día todavía.';
        }
        renderAll();
        if (!dirty) setStatus('connected', 'Sincronizado');
      },
      (err) => {
        console.error('onSnapshot error', err);
        setStatus('error', 'Conexión perdida — reabre la página');
      }
    );
  }

  async function save(mode) {
    clearTimeout(autosaveTimer);
    if (!db) { setStatus('error', 'Sin conexión — no se pudo guardar'); return; }
    if (saving) return;
    const toWrite = pending;
    if (Object.keys(toWrite).length === 0) { setDirty(false); return; }
    saving = true;
    saveBtn.disabled = true;
    setStatus('', mode === 'auto' ? 'Autoguardando…' : 'Guardando…');

    const payload = Object.assign({}, toWrite, { _meta: { updatedAt: new Date().toISOString() } });
    const ref = db.collection('days').doc(currentDate);

    try {
      await ref.update(payload);
    } catch (err) {
      if (err && err.code === 'not-found') {
        try {
          await ref.set(payload);
        } catch (err2) {
          console.error('Error creando documento del día', err2);
          saving = false;
          saveBtn.disabled = false;
          setStatus('error', 'Error al guardar — inténtalo de nuevo');
          return;
        }
      } else {
        console.error('Error guardando', err);
        saving = false;
        saveBtn.disabled = false;
        setStatus('error', 'Error al guardar — inténtalo de nuevo');
        return;
      }
    }

    Object.keys(toWrite).forEach(id => { if (pending[id] === toWrite[id]) delete pending[id]; });
    setDirty(Object.keys(pending).length > 0);
    setStatus('connected', mode === 'auto' ? 'Autoguardado' : 'Guardado');
    lastSavedEl.textContent = 'Guardado por última vez: ' + new Date().toLocaleString('es-ES');
    saving = false;
    saveBtn.disabled = false;
  }

  dateInput.addEventListener('change', async () => {
    const newDate = dateInput.value;
    if (!newDate || newDate === currentDate) return;
    if (dirty) await save('manual');
    loadDate(newDate);
  });

  saveBtn.addEventListener('click', () => save('manual'));

  mapBtn.addEventListener('click', () => showView(currentView === 'map' ? 'list' : 'map'));

  // ---- Notificaciones ----
  // Cada notificación es un documento en la colección "notifications": { date, text, createdAt }.
  // "Leída" se guarda en este dispositivo (cada compañero tiene que leerla en el suyo).
  const NOTIF_READ_KEY = 'alarmaGuiasNotifLeidas';
  const notifReadMemory = new Set();
  let notifUnsub = null;
  let notifToday = '';
  let notifDocs = [];

  function notifIsRead(id) {
    if (notifReadMemory.has(id)) return true;
    try { return JSON.parse(localStorage.getItem(NOTIF_READ_KEY) || '[]').indexOf(id) !== -1; }
    catch (e) { return false; }
  }

  function notifMarkAllRead() {
    notifDocs.forEach(n => notifReadMemory.add(n.id));
    try {
      const saved = JSON.parse(localStorage.getItem(NOTIF_READ_KEY) || '[]');
      notifDocs.forEach(n => { if (saved.indexOf(n.id) === -1) saved.push(n.id); });
      localStorage.setItem(NOTIF_READ_KEY, JSON.stringify(saved));
    } catch (e) { /* sin localStorage: queda solo en memoria */ }
  }

  function notifUpdateButton() {
    notifBtn.classList.toggle('pulsing', notifDocs.some(n => !notifIsRead(n.id)));
  }

  function notifRenderList() {
    notifList.innerHTML = '';
    if (!notifDocs.length) {
      const p = document.createElement('p');
      p.textContent = 'No hay notificaciones para hoy.';
      notifList.appendChild(p);
      return;
    }
    notifDocs.forEach(n => {
      const item = document.createElement('div');
      item.className = 'notif-item';
      item.textContent = n.text;
      notifList.appendChild(item);
    });
  }

  function startNotifications() {
    if (!db) return;
    if (notifUnsub) { notifUnsub(); notifUnsub = null; }
    notifToday = todayISO();
    notifUnsub = db.collection('notifications').where('date', '==', notifToday).onSnapshot(
      (snap) => {
        const list = [];
        snap.forEach(d => {
          const v = d.data() || {};
          list.push({ id: d.id, text: v.text || '', createdAt: v.createdAt || '' });
        });
        list.sort((a, b) => (a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0));
        notifDocs = list;
        if (!notifModal.classList.contains('hidden')) { notifRenderList(); notifMarkAllRead(); }
        notifUpdateButton();
      },
      (err) => { console.error('Notificaciones', err); }
    );
  }

  addNotifBtn.addEventListener('click', () => {
    notifDate.value = currentDate;
    notifText.value = '';
    notifError.textContent = '';
    addNotifModal.classList.remove('hidden');
    notifText.focus();
  });

  addNotifClose.addEventListener('click', () => addNotifModal.classList.add('hidden'));

  saveNotifBtn.addEventListener('click', () => {
    const date = notifDate.value;
    const text = notifText.value.trim();
    if (!date || !text) { notifError.textContent = 'Elige una fecha y escribe el texto.'; return; }
    if (!db) { notifError.textContent = 'Sin conexión con la base de datos.'; return; }
    notifError.textContent = '';
    db.collection('notifications')
      .add({ date: date, text: text, createdAt: new Date().toISOString() })
      .catch((e) => {
        console.error('Error guardando notificación', e);
        alert('No se pudo guardar la notificación. Inténtalo de nuevo.');
      });
    addNotifModal.classList.add('hidden');
  });

  notifBtn.addEventListener('click', () => {
    notifRenderList();
    notifMarkAllRead();
    notifUpdateButton();
    notifModal.classList.remove('hidden');
  });

  notifClose.addEventListener('click', () => notifModal.classList.add('hidden'));
  notifModal.addEventListener('click', (e) => { if (e.target === notifModal) notifModal.classList.add('hidden'); });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && notifToday && notifToday !== todayISO()) startNotifications();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && dirty) save('auto');
  });

  async function init() {
    buildStaticLayout();
    buildMapLayout();
    renderAll();

    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    startNotifications();
    const auth = firebase.auth();

    const overlay = document.getElementById('loginOverlay');
    const form = document.getElementById('loginForm');
    const passEl = document.getElementById('loginPass');
    const btnEl = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    let started = false;

    // Iniciar sin autenticación
    (async () => {
      if (started) return;
      started = true;
      try {
        await db.collection('days').doc('test-connection').get();
        setStatus('connected', 'Sincronizado');
      } catch (e) {
        console.error('Firebase error', e);
        setStatus('error', 'Sin conexión de datos — inténtalo después');
        started = false;
        return;
      }
      loadDate(currentDate);
    })();
  }

  init();
})();
</script>

</body>
</html>
